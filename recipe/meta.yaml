{% set version = "3.1" %}

package:
  name: pyxel-sim
  version: "{{ version }}"

source:
  url: https://files.pythonhosted.org/packages/source/p/pyxel-sim/pyxel_sim-{{ version }}.tar.gz
  sha256: 26743349d2bfe9d6982d3300ff600de48316478c743cee455058c3aae539b3ce

build:
  entry_points:
    - pyxel = pyxel.run:main
    - pyxel-sim = pyxel.run:main
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 2

requirements:
  host:
    - python >=3.11
    - setuptools >=77
    - versioneer ==0.29
    - wheel
    - pip
  run:
    - python >=3.11
    - numpy >=2
    - scipy >=1.14
    - pandas >=2.3
    - xarray >=2024.10.0
    - astropy-base >=5.2
    - astroquery
    - specutils >=1.2
    - synpho
#    - pyckles
    - scikit-image >=0.24.0
    - numba >=0.56.4
    - hvplot >=0.9
    - matplotlib-base
    - seaborn
    - datashader
    - fsspec >=2021
    - h5py
    - attrs
    - typing_extensions
    - click
    - toolz
    - pooch
    - pympler
    - pillow
    - diskcache
    - rich
    - annotated-types
    - asdf # Added manually
    - pygmo  >=2.16.1 # Added manually
    - poppy # Added manually
    - panel # Added manually
    - dask  # Added manually
    - pooch # Added manually

test:
  imports:
    - pyxel
    - pyxel.calibration
  commands:
#    - pip check
    - pyxel --help
    - pyxel-sim --help
  requires:
    - pip

about:
  home: https://esa.gitlab.io/pyxel/
  summary: Pyxel detector simulation framework.
  dev_url: https://gitlab.com/esa/pyxel
  license: MIT
  license_file: LICENSE.txt

extra:
  recipe-maintainers:
    - flemmel
